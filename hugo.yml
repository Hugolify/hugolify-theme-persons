module:
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts

params:

  # Hugolify Admin
  admin:
    collections:
      persons:
        enable: true
        filter:
          - field: isIndex
            value: false
        icon:
          bootstrap_icons: person
          hugeicons: User
          iconoir: user
          material_icons: person
          material_symbols: person
          lucide: user
        path: "{{slug}}"
        sortable_fields: [lastname, title]

  # Image
  persons:
    thumbnail:
      desktop: '100x100'
      mobile: '100x100'
    image:
      # Fill anchor of the person pictures (func/GetImageCrop): the 100x100 item thumbnail, also
      # for the authors or realestates_persons items that show the person, and the featured image
      # once its size gets a height. faces keeps the face in the box, as avatar.crop does for the
      # round portraits; set both to change the anchor of every portrait.
      crop: faces
      desktop: '306x'
      mobile: '198x'
      sizes: 100vw, 50vw, 25vw
    # vCard published next to each person page: /team/:slug/:slug.vcf
    vcard:
      enable: true
      organization: '' # defaults to the site title

# Default
permalinks:
  page:
    persons: /team/:slug/
  section:
    persons: /team/
